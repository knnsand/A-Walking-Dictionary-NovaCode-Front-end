name: Frontend CI

# Verifica el frontend: lint, pruebas unitarias (Vitest) y build.
# Independiente de e2e.yml (pruebas end-to-end con Playwright).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Si llega un commit nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build
