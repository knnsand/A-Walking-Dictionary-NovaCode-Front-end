name: Frontend CI

# Verifica el frontend: lint, pruebas unitarias con cobertura (Vitest), análisis de
# calidad (SonarQube Cloud) y build.
# Independiente de e2e.yml (pruebas end-to-end con Playwright).

on:
  push:
    branches: [develop, main, feature/frontend/sonarqube]
  pull_request:
    branches: [develop, main]


# Si llega un commit nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # SonarQube necesita el historial completo para atribuir los cambios

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage  # pruebas + coverage/lcov.info para SonarQube

      # Análisis de calidad: lee sonar-project.properties de la raíz del repo.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: npm run build
