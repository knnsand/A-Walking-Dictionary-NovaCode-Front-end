version: 2

updates:
  # Dependencias npm (backend o frontend, según el repo donde se copie el archivo)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # Agrupa actualizaciones menores y parches para no saturar de PRs
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Mantiene al día las acciones usadas en los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
