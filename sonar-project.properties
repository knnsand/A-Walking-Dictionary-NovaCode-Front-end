# Configuración de SonarQube Cloud para el frontend. La lee el paso "SonarQube Scan" de
# .github/workflows/ci.yml (el analizador busca este archivo en la raíz del repo).

# Reemplazar con los valores que muestra SonarQube Cloud al importar el proyecto.
sonar.projectKey=knnsand_A-Walking-Dictionary-NovaCode-Front-end
sonar.organization=novacode
sonar.projectName=A-Walking-Dictionary-NovaCode-Front-end

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.sourceEncoding=UTF-8

# Reporte de cobertura que genera "npm run test:coverage" (Vitest + coverage-v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluidos SOLO del cálculo de cobertura (se siguen analizando para bugs, code smells y
# vulnerabilidades):
# - main.jsx solo monta la aplicación en el DOM.
# - mocks son datos simulados para trabajar sin backend (VITE_USE_MOCK).
# - i18n son las traducciones y la configuración de react-i18next.
# Mantener esta lista igual a coverage.exclude de vite.config.js.
sonar.coverage.exclusions=src/main.jsx,src/**/mocks/**,src/i18n/**
